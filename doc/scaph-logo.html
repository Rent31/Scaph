<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaph logo</title>
<style>
  :root {
    --ground: #0E0F13;
    --coral:  #FF7A59;
    --amber:  #FFB547;
    --teal:   #2FD1B5;
    --violet: #7A5CFF;
    --ivory:  #F4F1EA;
    --size: 300px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--ground);
  }

  .logo {
    position: relative;
    width: var(--size);
    height: var(--size);
  }

  /* thin outer ring */
  .logo::before {
    content: "";
    position: absolute;
    inset: calc(var(--size) * -0.0867);
    border: 1.5px solid rgba(244, 241, 234, 0.28);
    border-radius: 50%;
  }

  /* four leaf-shaped petals */
  .petal {
    position: absolute;
    width: 53.33%;
    height: 53.33%;
    mix-blend-mode: screen;
  }
  .petal.tl { left: 0;      top: 0;      background: var(--coral);  border-radius: 100% 0 100% 0; }
  .petal.tr { right: 0;     top: 0;      background: var(--amber);  border-radius: 0 100% 0 100%; }
  .petal.bl { left: 0;      bottom: 0;   background: var(--violet); border-radius: 0 100% 0 100%; }
  .petal.br { right: 0;     bottom: 0;   background: var(--teal);   border-radius: 100% 0 100% 0; }

  /* dark center ring */
  .hole {
    position: absolute;
    inset: 35.33%;
    border-radius: 50%;
    background: var(--ground);
  }

  /* center dot */
  .dot {
    position: absolute;
    inset: 44.67%;
    border-radius: 50%;
    background: var(--ivory);
  }
</style>
</head>
<body>

<div class="logo" role="img" aria-label="Scaph logo">
  <div class="petal tl"></div>
  <div class="petal tr"></div>
  <div class="petal bl"></div>
  <div class="petal br"></div>
  <div class="hole"></div>
  <div class="dot"></div>
</div>

</body>
</html>
